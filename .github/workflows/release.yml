name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            label: x86_64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build CLI
        env:
          OMASAFE_SOURCE_REVISION: ${{ github.sha }}
        run: cargo build --locked --release --target "${{ matrix.target }}" -p omasafe-cli

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Stage release asset
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ github.ref_name }}
        run: ./scripts/stage-release-asset.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  # Evidence published with the release: OmaSafe's own source scan, the
  # pinned-corpus sample report, and the native-validator parity report.
  # Sample-based and informational — the full corpus run lives in the
  # scheduled nightly workflow; the release gate consumes these artifacts
  # per the README checklist before a tag is cut locally.
  reports:
    name: Self-scan, corpus, and parity reports
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build CLI
        run: cargo build --locked --release -p omasafe-cli

      - name: Generate self-scan report
        run: |
          mkdir -p release-reports
          ./target/release/omasafe-cli scan-plugin --path . --format json \
            > release-reports/self-scan.json

      - name: Generate corpus sample report
        run: |
          python3 scripts/run-corpus.py \
            --manifest fixtures/corpus/manifest.json \
            --sample 12 \
            --cache "$RUNNER_TEMP/omasafe-corpus-cache" \
            --output release-reports/corpus-sample.json

      - name: Generate validator-parity report
        run: |
          python3 scripts/validator-parity.py \
            --manifest fixtures/corpus/manifest.json \
            --cache "$RUNNER_TEMP/omasafe-corpus-cache" \
            --sample 12 \
            --output release-reports/validator-parity.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: release-reports/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, reports]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-x86_64-unknown-linux-gnu
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release-reports
          pattern: release-reports
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tar.gz release/*.sha256 release/*.sigstore.json \
            release-reports/*.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
