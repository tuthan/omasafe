[package]
name = "omasafe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local trust, payload analysis, and drift review for Omarchy plugins"

[[bin]]
name = "omasafe-cli"
path = "src/main.rs"

# The shipped CLI parses real QML syntax (ADR 0001); the alias lets
# `--no-default-features` exercise the documented lexical-fallback mode.
[features]
default = ["qml-parser"]
qml-parser = ["omasafe-analyzer/qml-parser"]

[dependencies]
omasafe-analyzer = { path = "../omasafe-analyzer" }
omasafe-core = { path = "../omasafe-core" }
omasafe-marketplace = { path = "../omasafe-marketplace" }
omasafe-plugin-trust = { path = "../omasafe-plugin-trust" }
omasafe-report = { path = "../omasafe-report" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true

[build-dependencies]
sha2.workspace = true
libc.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json.workspace = true
tempfile = "3"
