[workspace]
members = [
    "crates/omasafe-cli",
    "crates/omasafe-core",
    "crates/omasafe-marketplace",
    "crates/omasafe-plugin-trust",
    "crates/omasafe-report",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/tuthan/omasafe"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
thiserror = "2"
