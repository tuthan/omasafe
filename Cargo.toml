[workspace]
members = [
    "crates/omasafe-cli",
    "crates/omasafe-core",
    "crates/omasafe-plugin-trust",
    "crates/omasafe-report",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "git@github.com:tuthan/omasafe.git"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
